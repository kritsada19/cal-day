name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
      
    env:
      DATABASE_URL: postgresql://user:password@localhost:5432/db?schema=public
      REDIS_URL: redis://localhost:6379
      NEXTAUTH_SECRET: dummy-secret-0123456789abcdefghijklmn
      NEXTAUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      STRIPE_SECRET_KEY: dummy-stripe-key
      STRIPE_WEBHOOK_SECRET: dummy-stripe-webhook-key
      STRIPE_PRO_PRICE_ID: dummy-price-id
      GOOGLE_CLIENT_ID: dummy-client-id
      GOOGLE_CLIENT_SECRET: dummy-client-secret
      GOOGLE_GENERATIVE_AI_API_KEY: dummy-gen-ai-key

      SKIP_ENV_VERIFICATION: 1

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: db
        # Mapping Port จากเครื่องรัน (5432) เข้า Service (5432)
        ports:
          - 5432:5432
        # ตรวจสอบว่า Database พร้อมใช้งานหรือยังก่อนเริ่มรันขั้นตอนถัดไป
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Lint
        run: npm run lint

      - name: Setup Test Database
        run: |
          npx prisma db push --accept-data-loss
          npx prisma db seed

      - name: Run Tests
        run: npm run test
        env:
          # ระบุว่าเป็นโหมดเทส
          NODE_ENV: test

      - name: Build project
        run: npm run build
  
  deploy:
    needs: build-and-test
    # รันเฉพาะเมื่อเป็นเหตุการณ์ Push และอยู่ที่ Branch 'main' เท่านั้น
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # รันบน Ubuntu รุ่นล่าสุด
    runs-on: ubuntu-latest
    
    # กำหนด Environment Variables สำหรับ Vercel (ต้องตั้งค่าใน GitHub Secrets ก่อน)
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      # คัดลอกโค้ดลงเครื่อง Runner
      - name: Checkout code
        uses: actions/checkout@v4

      # ติดตั้ง Node.js เวอร์ชันเดียวกับที่ใช้ในเครื่องเรา
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # ติดตั้ง Dependencies
      - name: Install dependencies
        run: npm ci

      # ขั้นตอนสำคัญ: อัปเดตโครงสร้างฐานข้อมูลตัวจริง (Production)
      - name: Migrate Production Database
        run: npx prisma migrate deploy
        env:
          # ใช้ URL ของฐานข้อมูลจริงจาก GitHub Secret
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # สร้าง Prisma Client อีกครั้งเพื่อเตรียมรองรับการ Build
      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # รัน Seed Database
      - name: Run seed
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SKIP_ENV_VALIDATION: "true"
        run: npx prisma db seed
          
